name: Check

on:
  pull_request:
  push:
    branches: [main]

# 门就是本地那一条 `bun run lint` 加一次构建，一字不差 —— CI 和本地跑的不是同
# 一组命令，是「在我机器上是好的」的标准来源。
#
# 步骤写在这里而不是复用组织里的 web-check.yml：那份工作流的输入形状要去
# JianyueLab-Org/actions 里确认，猜错了 CI 会以 startup_failure 收场，而那种
# 失败连日志都没有。等确认过再换成 uses: 也只是删掉这几行的事。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile：CI 不该顺手升级依赖。锁文件对不上就该红，而不是装
      # 一套和本地不同的东西然后通过。
      - run: bun install --frozen-lockfile

      # format:check + astro check + vue-tsc + bun test。第三项是必要的：
      # astro check 对 Vue SFC 里的任何类型错误都报 0 错误，而这个仓库几乎全
      # 是 .vue —— 少了它，整个库没有类型门。第四项只盖 src/motion/spring.ts，
      # 那是这里唯一能错得没人看得见的文件：别处出错是组件长歪，弹簧积分错了
      # 是「动效感觉有点廉价」，没人会为这个提 issue。
      - run: bun run lint

      - run: bun run build
